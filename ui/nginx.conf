# Same origin as in development (ADR-007): the browser calls /api, nginx strips the prefix
# and forwards to the API over the Compose network, so there is no CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # History-mode routes fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
